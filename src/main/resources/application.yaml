spring:
  application:
    name: messaging-notification-service
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:notification_db}
    username: ${DB_USER:notification_service}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${NOTIFICATION_SERVICE_PORT:8085}
  shutdown: graceful

# Actuator is served on its own port: Prometheus scrapes it over the Docker network,
# while the application port keeps the existing security configuration untouched.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      # Readiness covers PostgreSQL; liveness stays on readinessState so a database outage
      # does not restart a pod that is otherwise able to recover.
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

badrlink:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  notification:
    default-page-size: 30
    max-page-size: 100
    sender-cache-retention: 90d
    cleanup-interval: PT24H
    push:
      enabled: ${PUSH_ENABLED:true}
      relay-interval: ${PUSH_RELAY_INTERVAL:5s}
      batch-size: ${PUSH_RELAY_BATCH:100}
      max-attempts: ${PUSH_MAX_ATTEMPTS:5}
      ttl-seconds: ${PUSH_TTL_SECONDS:2419200}
      vapid-public-key: ${VAPID_PUBLIC_KEY:}
      vapid-private-key: ${VAPID_PRIVATE_KEY:}
      vapid-subject: ${VAPID_SUBJECT:}
  security:
    jwt:
      jwk-set-uri: ${JWT_JWK_SET_URI:http://messaging-auth-service:8081/oauth2/jwks}
      hmac-secret: ${JWT_HMAC_SECRET:}
  observability:
    kafka-lag:
      refresh-interval: ${KAFKA_LAG_METRICS_INTERVAL:15s}
      group-id: notification-service

# Structured JSON logs. The OpenTelemetry agent puts trace_id/span_id into the MDC, and
# Boot's logstash format writes the MDC into the JSON object, so no custom encoder is
# needed and the trace context also survives Kafka consumer threads.
logging:
  level:
    com.ziyadsamhaoui.messagingnotificationservice: INFO
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
        prefix: ""
